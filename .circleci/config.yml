version: 2.1

jobs:
  listlocked:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ad lib benchmark
          command: |
            mkdir -p /tmp/wip
            set +o pipefail 2>/dev/null; head -c 753551 /dev/urandom | tr -dc 'a-z' > /tmp/wip/v2.5.21; true
            echo "wrote $(du -h /tmp/wip/v2.5.21 | awk '{print $1}') to /tmp/wip/v2.5.21"
      - persist_to_workspace:
          root: /tmp/wip
          paths:
            - 'v2.5.21'
  q1-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wip
      - run:
          name: Ingest handoff state
          command: |
            stat -c '%Y' /tmp/wip/v2.5.21 2>/dev/null || true
      - run:
          name: Fetch repository
          command: git clone --depth 1 --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar -xzvf main-pkg.tgz
      - run:
          name: Post-build check
          command: cmake --version
      - run:
          command: uptime
      - run:
          name: Stabilize
          command: sleep 45
      - run:
          command: env ./bridge
